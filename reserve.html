<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RESERVEATION</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="reserve-page"> <header>
    <h1>Reserve a Table</h1>
</header>
    
    <main class="home-container">
        <!-- Booking Fotm Section -->
         <section class="hero-card">
            <div class="logo">Ivory Estate</div>
            <p>Join us for an unforgettable evening. please provide your details below.</p>
         
           <form class="booking-form" id="resForm">
            <div class="form-group">
                <input type="text" id="fullName" placeholder="Full name" required>
            </div>
            <div class="form-row">
                <input type="date"  id="resDate" required>
                <input type="time" id="resTime" min="17:00" max="23:00" required>
            </div>
            
            <div class="form-row">
                <select id="guests" required>
                    <option value="" disabled selected>Guests</option>
                    <option value="1">1 Person</option>
                    <option value="2">2 People</option>
                    <option value="3">4 People</option>
                    <option value="6+">6+ People</option>
                </select>
                <select id="seating" required>
                    <option value="" disabled selected>Seating prefrence</option>
                    <option value="Terrace">sun-drenched Terrace</option>
                    <option value="Indoor">Intimate Indoor</option>
                    <option value="Bar">Chef's Table</option>
                </select>
            </div>
            <button type="submit" class="confirm" style="border:none;cursor:pointer; width:100%;">Confirm Your Reservation</button>
           </form>

           <a href="index.html" class="back-link">← Back to Home</a>
           
        </section>
    </main>
    <script src="script.js"></script>
<footer>
    <P>© 2026 Ivory Estate</P>
</footer>
</body>
</html>
