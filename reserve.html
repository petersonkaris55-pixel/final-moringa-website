<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RESERVEATION</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <main class="home-container">
        <!-- Booking Fotm Section -->
         <section class="hero-card">
            <div class="logo">Ivory Estate</div>
           <h1>Secure Your Table</h1>
           <p>Join us for an unforgettable evening. please provide your details below.</p>
         
           <form class="booking-form">
            <div class="form-group">
                <input type="text" placeholder="Full name" required>
            </div>
            <div class="form-row">
                <input type="date" required>
                <input type="time" min="17:00" max="23:00" required>
            </div>
            
            <div class="form-row">
                <select required>
                    <option value="" disabled selected>Guests</option>
                    <option value="1">1 Person</option>
                    <option value="2">2 People</option>
                    <option value="3">4 People</option>
                    <option value="6+">6+ People</option>
                </select>
                <select required>
                    <option value="" disabled selected>Seating prefrence</option>
                    <option value="Terrace">sun-drenched Terrace</option>
                    <option value="Indoor">Intimate Indoor</option>
                    <option value="Bar">Chef's </option>
                </select>
            </div>
           </form>

           <a href="index.html" class="back-link">← Back to Home</a>
        </section>
    </main>
    <script src="script.js"></script>

</body>
</html>
