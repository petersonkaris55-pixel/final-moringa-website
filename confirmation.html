<!DOCTYPE html>
<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>confirmation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body clas="reserve-page">
    <header>
        <h1>reservation confirmed</h1>
    </header>
    
    <main class="home-container">
        <section class="hero-card">
            <div class="logo">Ivory Estate</div>
            <div style="font-size: 4rem; margin-bottom: 20px;">✅</div>
            <h1>Thank You !</h1>
            <p>Your table has been successfully reserved.We have sent confirmation detail to your provided contact information.</p>
            <div class="confirmation-details" style="margin-bottom: 30px; text-align: left; background: rgba((0,0,0,0.2); padding: 20px border-radius: 10px;">
                <p style="margin: 5px 0;"><strong>location:</strong>Main Dining Hall / Terrace</p>
                <p style="margin: 5px 0;"><strong>Status:</strong>confirmed</p>
            </div>
            <p>We look foward to hosting you for an unforgettable evening</p>
        </section>
    </main>
